# fly.toml app configuration file generated for artcontrol on 2026-05-19T02:09:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'artcontrol'
primary_region = 'gru'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  size = 'shared-cpu-1x'
